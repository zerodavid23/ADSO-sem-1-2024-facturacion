{%extends 'layout.html'%} {%block contenido%}
<h1>iniciar sesion</h1>
<form id="loginForm">
  <div class="form-group">
    <label for="email">correo electronico registrado</label>
    <input
      type="email"
      class="form-control"
      id="email"
      placeholder="ingrese correo"
      required
    />
    <small class="form-text text-muted"
      >Nunca compartiremos tu correo electrónico con nadie más..</small
    >
  </div>
  <div class="form-group">
    <label for="Password">contraseña</label>
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="contraseña"
      required
    />
  </div>

  <div class="form-check">
    <input type="checkbox" class="form-check-input" id="Check" />
    <label class="form-check-label" for="Check">verificame</label>
  </div>
  <button type="submit" class="btn btn-primary">ingresar</button>
</form>
<script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", function (event) {
      event.preventDefault();

      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      if (email === "" || password === "") {
        alert("Por favor, ingresa tu correo y contraseña.");
        return;
      }

      if (email === "usuario@gmail.com" && password === "123456") {
        alert("Inicio de sesión exitoso");
        window.location.href = "lista_productos.html";
      } else {
        alert("Correo o contraseña incorrectos.");
      }
    });
</script>
{%endblock contenido%}
