{%extends 'layout.html'%} {%block contenido%}
<h1>iniciar sesion</h1>
<form id="loginForm">
  <div class="form-group">
    <label for="usuario">nombre de usuario registrado</label>
    <input
      type="user"
      class="form-control"
      id="user"
      placeholder="ingrese su usuario"
      required
    />
    <small class="form-text text-muted"
      >Nunca comparta su informacion de inicio de sesion</small
    >
  </div>
  <div class="form-group">
    <label for="Password">contraseña</label>
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="ingrese su contraseña"
      required
    />
  </div>

  <div class="form-check">
    <input type="checkbox" class="form-check-input" id="Check" />
    <label class="form-check-label" for="Check">verificame</label>
  </div>
  <button type="submit" class="btn btn-primary">ingresar</button>
</form>
<script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", function (event) {
      event.preventDefault();

      let user = document.getElementById("user").value;
      let password = document.getElementById("password").value;

      if (user === "" || password === "") {
        alert("Por favor, ingresa tu usuario y contraseña.");
        return;
      }

      if (user === "juan.camacho" && password === "123456") {
        alert("Inicio de sesión exitoso");
        window.location.href = "lista_productos";
      } else {
        alert("Usuario o contraseña incorrectos.");
      }
    });
</script>
{%endblock contenido%}
