{%extends 'layout.html'%}

{%block contenido%}
<h2>registrarse</h2>
<form id="registroform">
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="correo">Correo</label>
      <input type="email" class="form-control" id="correo" placeholder="ingrese un correo" required>
    </div>
     <div class="form-group col-md-6">
      <label for="correo">Nombre completo</label>
      <input type="text" class="form-control" id="nombrecm" placeholder="Ingrese su nombre completo" required>
    </div>
    <div class="form-group">
      <label for="usuario">nombre de usuario</label>
      <input type="text" class="form-control" id="usuario" placeholder="Cree un usuario" required>
    </div>
    <div class="form-group col-md-6">
      <label for="password">Contraseña</label>
      <input type="password" class="form-control" id="password" placeholder="ingrse una contraseña" required>
    </div>

    <div class="form-group col-md-6">
      <label for="confirmpassword">confirme contraseña</label>
      <input type="password" class="form-control" id="confirmpassword" placeholder="ingrese de nuevo su contraseña"
        required>
    </div>


    <div class="form-group col-md-6">
      <label for="categoria">¿cual es su area?</label>
      <select id="categoria" name="categoria" class="form-control">
        <option selected>Por favor seleccione...</option>
        
        {% for categoria in categorias %}
        
          <option value="{{categoria.id}}">{{categoria.nombre_categoria}}</option>
        
        {% endfor %}  
      </select>
    </div>

    <div class="form-group col-md-6 d-flex align-items-center ">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="gridCheck" required>
        <label class="form-check-label" for="gridCheck">
          verificame
        </label>
      </div>

    </div>
    <div class="text-center mt-6"></div>
    <button type="submit" class="btn btn-primary">registrarse</button>

</form>
<div id="mensajeRegistro"
  style="display: none; margin-top: 10px; padding: 10px; border: 1px solid green; color: green;">
  <p><strong>Te has registrado correctamente.</strong></p>
  <p>Estos son tus datos de registro:</p>
  <ul>
    <li><strong>Correo:</strong> <span id="mostrarcorreo"></span></li>
    <li><strong>Usuario:</strong> <span id="mostrarusuario"></span></li>
    <li><strong>Área:</strong> <span id="mostrararea"></span></li>
  </ul>
</div>

<script>
  document.getElementById("registroform").addEventListener("submit", function (event) {
    event.preventDefault();


    let correo = document.getElementById("correo").value;
    let usuario = document.getElementById("usuario").value;
    let area = document.getElementById("area").value;


    document.getElementById("mostrarcorreo").innerText = correo;
    document.getElementById("mostrarusuario").innerText = usuario;
    document.getElementById("mostrararea").innerText = area;


    document.getElementById("mensajeRegistro").style.display = "block";


    document.getElementById("registroform").reset();


  });
</script>
{%endblock contenido%}
