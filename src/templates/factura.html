{% extends 'layout.html' %} {% block contenido %}
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Imprimir Factura</h2>
    </div>
    <div class="card-body">
      <form id="facturaform" method="POST">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="correo">Correo</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              placeholder="Ingrese un correo"
              required
              name="correo"
              onblur="ValidarCorreo()"
              {%
              if
              factura_almacenar
              %}
              value="{{ factura_almacenar.usuario.correo }}"
              {%
              endif
              %}
            />
          </div>
          <div class="form-group col-md-6">
            <label for="usuario">Nombre de usuario</label>
            <input
              type="text"
              class="form-control"
              id="usuario"
              placeholder="Ingrese un usuario"
              required
              name="nombre_usuario"
              onblur="ValidarUsuario()"
              {%
              if
              factura_almacenar
              %}
              value="{{ factura_almacenar.usuario.nombre_usuario}}"
              {%
              endif
              %}
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="codigoproduct">Código producto</label>
            <input
              type="text"
              class="form-control"
              id="codigoproduct"
              onblur="ValidarCodigo()"
              placeholder="Ingrese el código del producto"
              required
              name="id_producto"
              {%
              if
              factura_almacenar
              %}
              value="{{ factura_almacenar.Producto_object.id_producto }}"
              {%
              endif
              %}
            />
          </div>
          <div class="form-group col-md-5">
            <label for="nombre_producto">Nombre del producto</label>
            <input
              type="text"
              class="form-control mb-2"
              id="nombre_producto"
              placeholder="Nombre del producto"
              required
              name="nombre_producto"
              {%
              if
              factura_almacenar
              %}
              value="{{ factura_almacenar.Producto_object.nombre_producto }}"
              {%
              endif
              %}
            />
          </div>
          <div class="form-group col-md-4">
            <label for="start">Fecha</label>
            <input
              type="date"
              class="form-control"
              id="fecha"
              name="fecha"
              {%
              if
              factura_almacenar
              %}
              value="{{ factura_almacenar.fecha.strftime('%Y-%m-%d') }}"
              {%
              endif
              %}
            />
            <label for="cantidad_producto">Cantidad del producto</label>
            <input
              type="number"
              class="form-control"
              id="cantidad_producto"
              placeholder="Cantidad del producto"
              required
              name="cantidad_ingresada"
              {%
              if
              factura_almacenar
              %}
              value="factura_almacenar.cantidad_ingresada"
              {%
              endif
              %}
            />
          </div>
        </div>
        <div class="form-row">
          <div class="col text-right">
            <button type="button" class="btn btn-success" id="agregarproducto">
              Agregar producto
            </button>
            <button
              type="button"
              class="btn btn-info"
              id="lista_facturas"
              onclick="window.location.href='{{ url_for('historial_facturas') }}';"
            >
              historial de facturas
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3 w-100">
          Imprimir factura
        </button>
      </form>
    </div>
  </div>

  <div id="factura" class="card mt-4 shadow" style="display: none">
    <div class="card-header bg-success text-white">
      <h2 class="mb-0">Factura</h2>
    </div>
    <div class="card-body">
      <p><strong>Correo:</strong> <span id="mostrarcorreo"></span></p>
      <p>
        <strong>nombre de Usuario:</strong> <span id="mostrarusuario"></span>
      </p>
      <p><strong>fecha de factura:</strong><span id="mostrar_fecha"></span></p>
      <div class="table-responsive">
        <table class="table table-bordered" id="tablafactura">
          <thead class="thead-light">
            <tr>
              <th>Código</th>
              <th>nombre del producto</th>
              <th>Cantidad</th>
              <th>Precio</th>
              <th>tipo de medida</th>
              <th>Categoría</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <h3 class="text-right">Total: $<span id="totalfactura">0</span></h3>
    </div>
  </div>
</div>
{% endblock contenido %}
